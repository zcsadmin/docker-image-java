name: Rebuild Java 25 On Upstream Update

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-if-upstream-changed:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Read latest upstream digests
        id: latest
        run: |
          set -euo pipefail
          digest_maven_25="$(skopeo inspect --format '{{.Digest}}' docker://maven:3.9-eclipse-temurin-25)"
          digest_temurin_25="$(skopeo inspect --format '{{.Digest}}' docker://eclipse-temurin:25-jre)"
          echo "digest_maven_25=${digest_maven_25}" >> "$GITHUB_OUTPUT"
          echo "digest_temurin_25=${digest_temurin_25}" >> "$GITHUB_OUTPUT"

      - name: Read stored digests
        id: stored
        run: |
          set -euo pipefail
          file_maven_25=".github/state/maven-3.9-eclipse-temurin-25.digest"
          file_temurin_25=".github/state/eclipse-temurin-25-jre.digest"
          if [ -f "$file_maven_25" ]; then
            echo "digest_maven_25=$(cat "$file_maven_25")" >> "$GITHUB_OUTPUT"
          else
            echo "digest_maven_25=" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "$file_temurin_25" ]; then
            echo "digest_temurin_25=$(cat "$file_temurin_25")" >> "$GITHUB_OUTPUT"
          else
            echo "digest_temurin_25=" >> "$GITHUB_OUTPUT"
          fi

      - name: Print digest comparison
        run: |
          echo "maven:3.9-eclipse-temurin-25 latest: ${{ steps.latest.outputs.digest_maven_25 }}"
          echo "maven:3.9-eclipse-temurin-25 stored: ${{ steps.stored.outputs.digest_maven_25 }}"
          echo "eclipse-temurin:25-jre latest: ${{ steps.latest.outputs.digest_temurin_25 }}"
          echo "eclipse-temurin:25-jre stored: ${{ steps.stored.outputs.digest_temurin_25 }}"

      - name: Compare digests
        id: compare
        run: |
          set -euo pipefail
          changed=false
          if [ "${{ steps.latest.outputs.digest_maven_25 }}" != "${{ steps.stored.outputs.digest_maven_25 }}" ] \
            || [ "${{ steps.latest.outputs.digest_temurin_25 }}" != "${{ steps.stored.outputs.digest_temurin_25 }}" ]; then
            changed=true
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: steps.compare.outputs.changed == 'true'
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push Java 25 images
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          bash ./build-and-push.sh 25

      - name: Persist latest digests
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p .github/state
          echo "${{ steps.latest.outputs.digest_maven_25 }}" > .github/state/maven-3.9-eclipse-temurin-25.digest
          echo "${{ steps.latest.outputs.digest_temurin_25 }}" > .github/state/eclipse-temurin-25-jre.digest

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/state/maven-3.9-eclipse-temurin-25.digest .github/state/eclipse-temurin-25-jre.digest
          git commit -m "chore: track upstream java base image digests" || exit 0
          git push

      - name: Skip build when unchanged
        if: steps.compare.outputs.changed == 'false'
        run: echo "Upstream maven:3.9-eclipse-temurin-25 and eclipse-temurin:25-jre digests unchanged. Skipping build."